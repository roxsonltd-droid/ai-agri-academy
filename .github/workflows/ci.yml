name: AgriNexus CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  root-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install root
        run: npm ci
      - name: Typecheck root (api + server)
        run: npm run typecheck
      - name: Fieldlot RAG index sanity
        run: npm run check:fieldlot-rag

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright (smoke)
        env:
          PLAYWRIGHT_NO_WEBSERVER: "1"
        run: |
          npm run start &
          echo "Waiting for http://127.0.0.1:3000 ..."
          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:3000/" >/dev/null 2>&1 || curl -fsS "http://127.0.0.1:3000/en" >/dev/null 2>&1; then
              echo "Server is up"
              break
            fi
            sleep 2
            if [ "$i" -eq 90 ]; then
              echo "Timeout waiting for Next.js"
              exit 1
            fi
          done
          npx playwright test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (tests)
        run: python -m ruff check tests
      - name: Pytest
        run: python -m pytest

  fieldlot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldlot
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fieldlot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
