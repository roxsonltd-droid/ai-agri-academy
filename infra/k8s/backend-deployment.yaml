apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrios-backend
  namespace: agrios-prod
  labels:
    app: agrios-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agrios-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: agrios-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/roxsonltd-droid/ai-agri-academy/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: agrios-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
