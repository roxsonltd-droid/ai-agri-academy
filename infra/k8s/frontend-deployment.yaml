apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrios-frontend
  namespace: agrios-prod
  labels:
    app: agrios-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agrios-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: agrios-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/roxsonltd-droid/ai-agri-academy/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: agrios-frontend-config
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
